name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{js,vue}" "tests/**/*.mjs" "ui-tests/**/*.js" "*.js" "*.json"

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages 无路由重写：用 404.html 复制 index.html，让 Vue Router 接管深链。
      - run: cp dist/index.html dist/404.html

      # 禁止 Jekyll 丢弃 _plugin-vue_export-helper-*.js 这类下划线 chunk。
      - run: touch dist/.nojekyll

      - if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
